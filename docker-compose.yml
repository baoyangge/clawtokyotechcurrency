services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Default for SQLite persisted on the mounted volume
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/dev.db}
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
